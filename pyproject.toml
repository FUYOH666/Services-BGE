[project]
name = "services-bge"
version = "0.2.0"
description = "Local OpenAI-compatible embedding and reranking services (bge-m3, Qwen3, any SentenceTransformer) for hybrid search on Apple Silicon, with model profiles and a retrieval eval harness"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Aleksandr Mordvinov", email = "iamfuyoh@gmail.com" },
]
requires-python = ">=3.12,<3.13"
keywords = [
    "embeddings", "reranker", "hybrid-search", "bge-m3", "qwen3", "qdrant",
    "rag", "retrieval", "sparse-vectors", "apple-silicon", "mps", "openai-compatible",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "FlagEmbedding>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "transformers>=4.45.0,<5.0",
]

[project.urls]
Homepage = "https://github.com/FUYOH666/Services-BGE"
Documentation = "https://github.com/FUYOH666/Services-BGE/tree/main/docs"
Changelog = "https://github.com/FUYOH666/Services-BGE/blob/main/CHANGELOG.md"
Issues = "https://github.com/FUYOH666/Services-BGE/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedding_service", "reranker_service", "service_common"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
