name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (fake models)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Secret and personal-path scan
        run: |
          set -u
          fail=0
          if git grep -nE '(^|[^0-9.])100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}($|[^0-9])' -- ':!uv.lock'; then
            echo "::error::Tailscale/CGNAT IP address in tracked files"; fail=1
          fi
          if git grep -nE '/Users/[A-Za-z0-9._-]+/' -- ':!uv.lock'; then
            echo "::error::Absolute /Users/<name>/ path in tracked files"; fail=1
          fi
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|hf_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}' -- ':!uv.lock'; then
            echo "::error::Private key or API token in tracked files"; fail=1
          fi
          exit "$fail"

      - uses: astral-sh/setup-uv@v6

      - name: Lockfile matches pyproject.toml
        run: uv lock --check

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      # Tests replace FlagEmbedding / sentence-transformers / torch with in-memory
      # fakes, so CI installs only the web stack instead of multi-GB torch wheels.
      - name: Install test dependencies
        run: |
          uv venv --python 3.12
          uv pip install "fastapi>=0.115" "pydantic>=2" "pydantic-settings>=2" "numpy>=1.26" "httpx>=0.27" "pytest>=8"

      - name: Run pytest
        run: .venv/bin/python -m pytest -q
