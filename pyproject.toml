[project]
name = "services-bge"
version = "0.1.0"
description = "BGE-M3 Embedding & BGE-Reranker-v2-m3 microservices for hybrid search in Qdrant"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Aleksandr Mordvinov", email = "iamfuyoh@gmail.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "FlagEmbedding>=1.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "transformers>=4.45.0,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["embedding_service", "reranker_service"]
